services:
  hydrawise-proxy:
    # Published multi-arch (amd64 + arm64), so `docker compose up -d` pulls a
    # ready-made image and never needs a build. TAG pins a release — set
    # TAG=1.0.0 in .env to stop tracking latest, or to roll back.
    # To build from source instead:
    #   docker compose -f compose.yaml -f compose.build.yaml up -d --build
    image: ghcr.io/lucasheight/hydrawise-proxy:${TAG:-latest}
    pull_policy: always

    container_name: hydrawise-proxy
    restart: unless-stopped

    # BIND_ADDR controls who can reach this. 0.0.0.0 = anyone on the LAN, which
    # is what LAN clients need; the proxy has no request auth, so at 0.0.0.0
    # anyone who can route to this host can start the irrigation. Set
    # BIND_ADDR=127.0.0.1 in .env to restrict it back to the host itself.
    ports:
      - "${BIND_ADDR:-0.0.0.0}:8123:8123"

    environment:
      # Sourced from .env alongside this file. Fails fast if unset.
      API_KEY: ${API_KEY:?set API_KEY in .env}
      RUN_SECONDS: ${RUN_SECONDS:-1800}
      RUN_PERIOD_ID: ${RUN_PERIOD_ID:-999}

      # Optional. Empty MQTT_URL means no broker connection is attempted.
      MQTT_URL: ${MQTT_URL:-}
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      MQTT_PREFIX: ${MQTT_PREFIX:-hydrawise}
      MQTT_DISCOVERY: ${MQTT_DISCOVERY:-1}
      MQTT_DISCOVERY_PREFIX: ${MQTT_DISCOVERY_PREFIX:-homeassistant}

    # Nothing is ever written to disk, so lock the filesystem down.
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    # Liveness without burning Hydrawise API quota: an unknown path returns 404
    # from the proxy itself and never touches upstream.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:8123/healthz',r=>process.exit(0)).on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

    # It logs every request; keep that from filling the disk over months.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
